<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce Website</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a class="logo" href="index.html">E-Commerce <span>Website</span></a><nav><a href="#shop">Shop</a><a href="#categories">Categories</a></nav><button id="openCart" class="cart">🛒 <b id="cartCount">0</b></button></header>
<section class="hero"><div><small>MODERN E-COMMERCE EXPERIENCE</small><h1>Shop smarter.<br><em>Live better.</em></h1><p>Discover quality products in tech, fashion, beauty and home.</p><a class="btn" href="#shop">Shop now</a></div><div class="hero-art">🛍️</div></section>
<main id="shop"><div class="heading"><div><small>OUR STORE</small><h2>Featured products</h2></div><div class="tools"><input id="search" placeholder="Search products…"><select id="filter"><option value="all">All categories</option></select></div></div><div id="categories" class="pills"></div><div id="products" class="grid"></div><div id="empty" class="empty" hidden>No products match your search.</div></main>
<div id="backdrop" class="backdrop"></div><aside id="drawer"><div class="drawer-head"><h2>Your cart</h2><button id="closeCart">✕</button></div><div id="cartItems"></div><div class="cart-foot"><div class="total"><span>Total</span><strong id="total">GH₵0.00</strong></div><a id="checkout" class="btn full" href="checkout.html">Checkout</a></div></aside><div id="toast" class="toast"></div>
<script src="js/products.js"></script><script src="js/app.js"></script></body></html>
